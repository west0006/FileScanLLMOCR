<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中南财经政法大学 - 档案智能查询与开放预审系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ========== 全局重置与变量 ========== */
:root {
  --primary: #1a3c6e;
  --primary-light: #2d6cdf;
  --primary-dark: #0f2747;
  --accent: #d4a017;
  --success: #52c41a;
  --warning: #faad14;
  --danger: #ff4d4f;
  --info: #1890ff;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #303030;
  --text-secondary: #707070;
  --text-light: #a0a0a0;
  --border: #e0e0e0;
  --border-light: #f0f0f0;
  --sidebar-width: 230px;
  --topbar-height: 56px;
  --radius: 6px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary-light); text-decoration: none; }
a:hover { text-decoration: underline; }
ul, ol { list-style: none; }
img { max-width: 100%; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 3px; }
::-webkit-scrollbar-track { background: transparent; }

/* ========== 登录页 ========== */
#loginPage {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0f2747 0%, #1a3c6e 40%, #2d6cdf 100%);
}
.login-card {
  width: 400px;
  background: rgba(255,255,255,0.95);
  border-radius: 12px;
  padding: 40px 36px 32px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
}
.login-logo {
  text-align: center; margin-bottom: 28px;
}
.login-logo .icon {
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 28px; color: #fff; margin-bottom: 12px;
}
.login-logo h1 { font-size: 18px; color: var(--primary); font-weight: 600; }
.login-logo p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.login-form .field { margin-bottom: 18px; }
.login-form label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.login-form input {
  width: 100%; height: 42px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; outline: none; transition: border-color .2s;
}
.login-form input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(45,108,223,0.1); }
.login-form .btn-login {
  width: 100%; height: 42px; border: none; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity .2s;
}
.login-form .btn-login:hover { opacity: 0.9; }
.login-form .role-select { display: flex; gap: 8px; margin-bottom: 18px; }
.login-form .role-select button {
  flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius);
  background: #fff; cursor: pointer; font-size: 12px; color: var(--text-secondary); transition: all .2s;
}
.login-form .role-select button.active {
  border-color: var(--primary-light); color: var(--primary-light); background: rgba(45,108,223,0.05);
}
.login-tip { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 16px; }

/* ========== 主布局 ========== */
#app { display: none; }
#app.show { display: block; }

/* 侧边栏 */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: var(--sidebar-width);
  background: var(--primary-dark);
  z-index: 100;
  overflow-y: auto;
  transition: transform .3s;
}
.sidebar-header {
  height: var(--topbar-height);
  display: flex; align-items: center; padding: 0 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.sidebar-header .logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--primary-light), #4a8de6);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff; margin-right: 10px; flex-shrink: 0;
}
.sidebar-header .logo-text { color: #fff; font-size: 14px; font-weight: 500; line-height: 1.3; }
.sidebar-header .logo-text small { display: block; font-size: 10px; color: rgba(255,255,255,0.5); font-weight: 400; }

.nav-section { padding: 8px 0; }
.nav-section-title {
  padding: 12px 18px 4px; font-size: 11px; color: rgba(255,255,255,0.3);
  text-transform: uppercase; letter-spacing: 1px;
}
.nav-item {
  display: flex; align-items: center; padding: 10px 18px;
  color: rgba(255,255,255,0.65); cursor: pointer; transition: all .15s;
  font-size: 13px; position: relative;
}
.nav-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
.nav-item.active { color: #fff; background: rgba(45,108,223,0.15); }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}
.nav-item .nav-icon { width: 20px; text-align: center; margin-right: 10px; font-size: 15px; }
.nav-item .badge {
  margin-left: auto; background: var(--danger); color: #fff;
  font-size: 10px; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center;
}

/* 顶栏 */
.topbar {
  position: fixed; left: var(--sidebar-width); top: 0; right: 0;
  height: var(--topbar-height);
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px;
  z-index: 99;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.topbar .breadcrumb { font-size: 13px; color: var(--text-secondary); }
.topbar .breadcrumb span { color: var(--text); font-weight: 500; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.topbar-right .icon-btn {
  width: 34px; height: 34px; border: none; background: none;
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary); position: relative; transition: background .2s;
}
.topbar-right .icon-btn:hover { background: var(--border-light); }
.topbar-right .icon-btn .dot {
  position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
  background: var(--danger); border-radius: 50%; border: 1.5px solid #fff;
}
.topbar-right .user-info {
  display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius);
  transition: background .2s;
}
.topbar-right .user-info:hover { background: var(--border-light); }
.topbar-right .avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500;
}
.topbar-right .user-name { font-size: 13px; color: var(--text); }
.topbar-right .user-role { font-size: 11px; color: var(--text-light); }

/* 内容区 */
.content {
  margin-left: var(--sidebar-width);
  margin-top: var(--topbar-height);
  padding: 20px 24px;
  min-height: calc(100vh - var(--topbar-height));
}

/* ========== 通用组件 ========== */
.card {
  background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; margin-bottom: 16px;
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-light);
}
.card-title { font-size: 15px; font-weight: 600; color: var(--text); }
.card-title::before { content: ''; display: inline-block; width: 3px; height: 14px; background: var(--primary-light); border-radius: 2px; margin-right: 8px; vertical-align: -2px; }

.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 7px 16px; border: 1px solid var(--border); border-radius: var(--radius);
  background: #fff; color: var(--text); font-size: 13px; cursor: pointer; transition: all .2s;
}
.btn:hover { border-color: var(--primary-light); color: var(--primary-light); }
.btn-primary { background: var(--primary-light); color: #fff; border-color: var(--primary-light); }
.btn-primary:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-success:hover { opacity: .9; color: #fff; }
.btn-warning { background: var(--warning); color: #fff; border-color: var(--warning); }
.btn-warning:hover { opacity: .9; color: #fff; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { opacity: .9; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-link { background: none; border: none; color: var(--primary-light); padding: 0; cursor: pointer; font-size: 13px; }
.btn-link:hover { text-decoration: underline; }

/* 统计卡片 */
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.stat-card {
  background: #fff; border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.stat-card .stat-icon {
  position: absolute; right: 16px; top: 16px;
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.stat-card .stat-label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
.stat-card .stat-value { font-size: 28px; font-weight: 700; color: var(--text); }
.stat-card .stat-trend { font-size: 12px; margin-top: 8px; }
.stat-card .stat-trend.up { color: var(--success); }
.stat-card .stat-trend.down { color: var(--danger); }

/* 表格 */
table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data-table th {
  text-align: left; padding: 10px 12px; background: #fafafa;
  border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-secondary); white-space: nowrap;
}
table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); }
table.data-table tr:hover { background: #fafbfc; }
table.data-table .ellipsis { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 标签 */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; line-height: 20px; }
.tag-blue { background: #e6f4ff; color: #1890ff; }
.tag-green { background: #f6ffed; color: #52c41a; }
.tag-orange { background: #fff7e6; color: #fa8c16; }
.tag-red { background: #fff1f0; color: #ff4d4f; }
.tag-gray { background: #f5f5f5; color: #999; }
.tag-purple { background: #f9f0ff; color: #722ed1; }

/* 进度条 */
.progress { height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; border-radius: 4px; transition: width .3s; }

/* 搜索框 */
.search-box {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
}
.search-box .input-wrap { flex: 1; position: relative; }
.search-box .input-wrap input {
  width: 100%; height: 40px; padding: 0 16px 0 40px;
  border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none;
}
.search-box .input-wrap input:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(45,108,223,0.1); }
.search-box .input-wrap .search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text-light);
}

/* 筛选栏 */
.filter-bar {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
}
.filter-bar select, .filter-bar input {
  height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; outline: none; background: #fff;
}

/* 日志分类标签栏 */
.log-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); margin-bottom:16px; }
.log-tab {
  padding:10px 20px; border:none; background:none; font-size:14px; cursor:pointer;
  color:var(--text-secondary); border-bottom:2px solid transparent; margin-bottom:-2px;
  transition:all .2s; display:flex; align-items:center; gap:6px;
}
.log-tab:hover { color:var(--primary-light); }
.log-tab.active { color:var(--primary); font-weight:600; border-bottom-color:var(--primary); }
.log-tab-count { font-size:11px; background:#f0f0f0; color:var(--text-secondary); padding:1px 8px; border-radius:10px; }
.log-tab.active .log-tab-count { background:var(--primary); color:#fff; }

/* 档案结果卡片 */
.archive-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.archive-item {
  background: #fff; border-radius: var(--radius); padding: 16px 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: all .2s;
  border-left: 3px solid transparent;
}
.archive-item:hover { box-shadow: var(--shadow-lg); border-left-color: var(--primary-light); }
.archive-item .archive-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.archive-item .archive-meta { display: flex; gap: 16px; font-size: 12px; color: var(--text-secondary); flex-wrap: wrap; }
.archive-item .archive-snippet { font-size: 13px; color: var(--text-secondary); margin-top: 6px; line-height: 1.5; }
.archive-item .archive-snippet .highlight { background: #fff3cd; color: #856404; padding: 0 2px; border-radius: 2px; }

/* 分页 */
.pagination { display: flex; gap: 4px; justify-content: center; margin-top: 20px; align-items: center; }
.pagination button {
  min-width: 32px; height: 32px; border: 1px solid var(--border); background: #fff;
  border-radius: var(--radius); cursor: pointer; font-size: 13px; color: var(--text); transition: all .2s;
}
.pagination button:hover { border-color: var(--primary-light); color: var(--primary-light); }
.pagination button.active { background: var(--primary-light); color: #fff; border-color: var(--primary-light); }
.pagination button:disabled { color: var(--text-light); cursor: not-allowed; }

/* 模态框 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #fff; border-radius: 8px; max-width: 900px; width: 100%; max-height: 90vh;
  overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.modal-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1;
}
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { font-size: 20px; cursor: pointer; color: var(--text-light); border: none; background: none; }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* 档案目录树 */
.tree-container {
  border:1px solid var(--border); border-radius:var(--radius);
  max-height:380px; overflow-y:auto; padding:6px; background:#fafbfc;
}
.tree-search {
  margin-bottom:8px;
}
.tree-search input {
  width:100%; height:32px; padding:0 10px; border:1px solid var(--border);
  border-radius:var(--radius); font-size:12px; outline:none;
}
.tree-search input:focus { border-color:var(--primary-light); }
.tree-node { }
.tree-node-row {
  display:flex; align-items:center; padding:4px 6px; cursor:pointer;
  border-radius:4px; font-size:13px; transition:background .12s; user-select:none;
}
.tree-node-row:hover { background:rgba(45,108,223,0.07); }
.tree-toggle {
  width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
  font-size:11px; color:var(--text-secondary); flex-shrink:0; cursor:pointer;
}
.tree-toggle.leaf { visibility:hidden; }
.tree-checkbox {
  width:16px; height:16px; margin-right:6px; flex-shrink:0; cursor:pointer;
  accent-color:var(--primary-light);
}
.tree-label { flex:1; line-height:1.5; }
.tree-label.folder { font-weight:500; }
.tree-count { font-size:11px; color:var(--text-light); margin-left:4px; }
.tree-children { margin-left:20px; display:none; }
.tree-children.show { display:block; }
.tree-selected-bar {
  margin-top:10px; padding:8px 10px; background:#f0f7ff; border:1px solid #d4e8ff;
  border-radius:var(--radius); font-size:12px; min-height:36px; display:flex; flex-wrap:wrap; gap:4px; align-items:center;
}
.tree-tag {
  display:inline-flex; align-items:center; gap:4px; background:#e6f4ff; color:#1890ff;
  border:1px solid #91d5ff; border-radius:4px; padding:2px 8px; font-size:12px; white-space:nowrap;
}
.tree-tag .tag-remove { cursor:pointer; font-weight:bold; margin-left:2px; }
.tree-tag .tag-remove:hover { color:var(--danger); }
.tree-empty-hint { color:var(--text-light); font-size:12px; }
.tree-toolbar {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;
}
.tree-toolbar .tree-actions { display:flex; gap:6px; }
.tree-toolbar .tree-actions button {
  border:1px solid var(--border); background:#fff; border-radius:4px; padding:3px 10px;
  font-size:12px; cursor:pointer; color:var(--text-secondary);
}
.tree-toolbar .tree-actions button:hover { border-color:var(--primary-light); color:var(--primary-light); }

/* 检索范围选择器 */
.scope-selector { position:relative; flex-shrink:0; }
.scope-btn {
  display:flex; align-items:center; gap:6px; height:40px; padding:0 14px;
  border:1px solid var(--border); border-radius:var(--radius); background:#fff;
  font-size:13px; cursor:pointer; white-space:nowrap; transition:border-color .2s;
}
.scope-btn:hover { border-color:var(--primary-light); }
.scope-btn .scope-text { max-width:160px; overflow:hidden; text-overflow:ellipsis; }
.scope-popover {
  display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:1000;
  background:#fff; border:1px solid var(--border); border-radius:8px;
  padding:12px; width:400px; max-height:450px; overflow:auto;
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}
.scope-popover.show { display:block; }

/* 检索层级选择 */
.level-select {
  height:40px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius);
  font-size:13px; background:#fff; outline:none; flex-shrink:0;
}

/* 检索结果左侧筛选 */
.search-layout { display:flex; gap:16px; }
.search-sidebar { width:240px; flex-shrink:0; }
.search-main { flex:1; min-width:0; }
.filter-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px; }
.filter-card-title { font-size:13px; font-weight:600; margin-bottom:10px; color:var(--text); display:flex; align-items:center; gap:4px; }
.filter-tree-node { padding:4px 8px; font-size:12px; cursor:pointer; border-radius:4px; display:flex; justify-content:space-between; align-items:center; }
.filter-tree-node:hover { background:rgba(45,108,223,0.07); }
.filter-tree-node.active { background:rgba(45,108,223,0.12); color:var(--primary); font-weight:500; }
.filter-tree-count { font-size:11px; color:var(--text-light); background:#f0f0f0; padding:1px 6px; border-radius:10px; }
.filter-tree-node.active .filter-tree-count { background:var(--primary); color:#fff; }
.filter-tree-children { margin-left:12px; }
.filter-year-item { padding:5px 10px; font-size:12px; cursor:pointer; border-radius:4px; display:flex; justify-content:space-between; align-items:center; }
.filter-year-item:hover { background:rgba(45,108,223,0.07); }
.filter-year-item.active { background:rgba(45,108,223,0.12); color:var(--primary); font-weight:500; }
.filter-year-count { font-size:11px; color:var(--text-light); background:#f0f0f0; padding:1px 6px; border-radius:10px; }
.filter-year-item.active .filter-year-count { background:var(--primary); color:#fff; }
.filter-reset-btn { font-size:11px; color:var(--primary); cursor:pointer; margin-left:auto; }

/* 项目/案卷级结果卡片 */
.level-card {
  background:#fff; border-radius:var(--radius); padding:14px 18px;
  box-shadow:var(--shadow); cursor:pointer; transition:all .2s;
  border-left:3px solid transparent; display:flex; align-items:center; gap:12px;
}
.level-card:hover { box-shadow:var(--shadow-lg); border-left-color:var(--primary-light); }
.level-card-icon { width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.level-card-body { flex:1; min-width:0; }
.level-card-title { font-size:14px; font-weight:600; margin-bottom:4px; }
.level-card-meta { font-size:12px; color:var(--text-secondary); display:flex; gap:12px; flex-wrap:wrap; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* 档案详情 */
.detail-section { margin-bottom: 24px; }
.detail-section h4 { font-size: 14px; font-weight: 600; color: var(--primary); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-light); }
.detail-row { display: flex; margin-bottom: 8px; }
.detail-label { width: 120px; color: var(--text-secondary); font-size: 13px; flex-shrink: 0; }
.detail-value { flex: 1; font-size: 13px; color: var(--text); }

/* 审核工作台 */
.review-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.review-doc-viewer {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px; min-height: 500px;
}
.doc-page {
  background: #fafafa; border: 1px solid var(--border); border-radius: 4px;
  padding: 32px; margin-bottom: 16px; font-family: "FangSong", "STFangsong", serif;
  font-size: 15px; line-height: 2; color: #333; position: relative;
}
.doc-page .page-num { position: absolute; bottom: 8px; right: 16px; font-size: 12px; color: var(--text-light); }
.doc-page .sensitive-mark { background: #ffe0e0; border-bottom: 2px solid var(--danger); cursor: pointer; }
.doc-page .ai-annotation {
  position: absolute; background: var(--danger); color: #fff;
  font-size: 11px; padding: 2px 8px; border-radius: 4px; white-space: nowrap;
}
.review-panel {
  background: #fff; border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 20px; height: fit-content;
}
.review-panel .ai-result { background: #f0f7ff; border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
.review-panel .risk-meter { text-align: center; margin-bottom: 16px; }
.review-panel .risk-circle {
  width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
}
.review-panel .risk-low { background: #f6ffed; color: var(--success); border: 3px solid var(--success); }
.review-panel .risk-medium { background: #fff7e6; color: var(--warning); border: 3px solid var(--warning); }
.review-panel .risk-high { background: #fff1f0; color: var(--danger); border: 3px solid var(--danger); }

/* 时间线 */
.timeline { padding-left: 20px; border-left: 2px solid var(--border); }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item::before {
  content: ''; position: absolute; left: -26px; top: 4px;
  width: 10px; height: 10px; border-radius: 50%; background: var(--primary-light);
  border: 2px solid #fff; box-shadow: 0 0 0 2px var(--primary-light);
}
.timeline-item .tl-time { font-size: 12px; color: var(--text-light); }
.timeline-item .tl-content { font-size: 13px; color: var(--text); margin-top: 2px; }

/* 图表容器 */
.chart-container { position: relative; height: 280px; }
.chart-container-sm { position: relative; height: 200px; }

/* 双栏布局 */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

/* 页面切换 */
.page { display: none; }
.page.active { display: block; }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }

/* 步骤条 */
.steps { display: flex; margin-bottom: 24px; }
.step { flex: 1; text-align: center; position: relative; }
.step::after { content: ''; position: absolute; top: 16px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
.step:last-child::after { display: none; }
.step .step-num {
  width: 32px; height: 32px; border-radius: 50%; background: var(--border);
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; position: relative; z-index: 1;
}
.step.active .step-num { background: var(--primary-light); }
.step.done .step-num { background: var(--success); }
.step .step-label { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.step.active .step-label { color: var(--primary); font-weight: 500; }

/* 响应式 */
@media (max-width: 1200px) {
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col, .three-col { grid-template-columns: 1fr; }
  .review-layout { grid-template-columns: 1fr; }
}
</style>
<style>
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
</style>

// 树状态：每个context独立维护展开和选中
const treeState = {};

function initTreeState(ctx) {
  if (!treeState[ctx]) {
    treeState[ctx] = { expanded: new Set(), selected: new Set() };
  }
  return treeState[ctx];
}

function findNodeById(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) {
      const found = findNodeById(n.children, id);
      if (found) return found;
    }
  }
  return null;
}

function getLeafIds(node) {
  if (!node.children) return [node.id];
  return node.children.flatMap(getLeafIds);
}

function getAllLeafIds(nodes) {
  return nodes.flatMap(getLeafIds);
}

function renderTreeNodes(nodes, ctx, depth) {
  let html = '';
  for (const node of nodes) {
    const hasChildren = node.children && node.children.length > 0;
    const state = initTreeState(ctx);
    const isExpanded = state.expanded.has(node.id);
    const leafIds = getLeafIds(node);
    const selectedLeaves = leafIds.filter(id => state.selected.has(id));
    const allSelected = selectedLeaves.length === leafIds.length && leafIds.length > 0;
    const someSelected = selectedLeaves.length > 0 && !allSelected;
    const checkboxState = allSelected ? 'checked' : '';
    const indeterminate = someSelected ? 'data-indeterminate="true"' : '';

    html += `<div class="tree-node">`;
    html += `<div class="tree-node-row">`;
    html += `<span class="tree-toggle ${hasChildren?'':'leaf'}" onclick="treeToggle('${node.id}','${ctx}')">${hasChildren?(isExpanded?'▼':'▶'):''}</span>`;
    html += `<input type="checkbox" class="tree-checkbox" ${checkboxState} ${indeterminate} onclick="treeCheck('${node.id}','${ctx}', event)" />`;
    html += `<span class="tree-label ${hasChildren?'folder':''}">${node.label}</span>`;
    if (hasChildren) {
      html += `<span class="tree-count">(${node.children.length})</span>`;
    }
    html += `</div>`;
    if (hasChildren) {
      html += `<div class="tree-children ${isExpanded?'show':''}" id="tree-children-${ctx}-${node.id}">`;
      html += renderTreeNodes(node.children, ctx, depth+1);
      html += `</div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderArchiveTree(ctx) {
  initTreeState(ctx);
  let html = `<div class="tree-toolbar">`;
  html += `<span style="font-size:12px;color:var(--text-secondary);">选择档案范围（勾选目录节点可级联选择下级）</span>`;
  html += `<div class="tree-actions">`;
  html += `<button onclick="treeSelectAll('${ctx}')">全选</button>`;
  html += `<button onclick="treeClearAll('${ctx}')">清空</button>`;
  html += `<button onclick="treeExpandAll('${ctx}')">展开全部</button>`;
  html += `<button onclick="treeCollapseAll('${ctx}')">折叠全部</button>`;
  html += `</div>`;
  html += `</div>`;
  html += `<div class="tree-container" id="tree-container-${ctx}">`;
  html += renderTreeNodes(ARCHIVE_TREE_DATA, ctx, 0);
  html += `</div>`;
  html += `<div class="tree-selected-bar" id="tree-selected-${ctx}"></div>`;
  // Defer update to after DOM is ready
  setTimeout(() => {
    const c = document.getElementById(`tree-container-${ctx}`);
    if (c) {
      c.querySelectorAll('input.tree-checkbox[data-indeterminate="true"]').forEach(cb => { cb.indeterminate = true; });
    }
    updateTreeSelectedDisplay(ctx);
  }, 0);
  return html;
}

function treeToggle(nodeId, ctx) {
  const state = initTreeState(ctx);
  if (state.expanded.has(nodeId)) {
    state.expanded.delete(nodeId);
  } else {
    state.expanded.add(nodeId);
  }
  refreshTree(ctx);
}

function treeCheck(nodeId, ctx, event) {
  const state = initTreeState(ctx);
  const node = findNodeById(ARCHIVE_TREE_DATA, nodeId);
  if (!node) return;
  const leafIds = getLeafIds(node);
  const checkbox = event.target;
  const isChecked = checkbox.checked;
  if (isChecked) {
    leafIds.forEach(id => state.selected.add(id));
  } else {
    leafIds.forEach(id => state.selected.delete(id));
  }
  refreshTree(ctx);
}

function treeSelectAll(ctx) {
  const state = initTreeState(ctx);
  getAllLeafIds(ARCHIVE_TREE_DATA).forEach(id => state.selected.add(id));
  refreshTree(ctx);
}

function treeClearAll(ctx) {
  const state = initTreeState(ctx);
  state.selected.clear();
  refreshTree(ctx);
}

function treeExpandAll(ctx) {
  const state = initTreeState(ctx);
  function expandAll(nodes) {
    for (const n of nodes) {
      if (n.children) { state.expanded.add(n.id); expandAll(n.children); }
    }
  }
  expandAll(ARCHIVE_TREE_DATA);
  refreshTree(ctx);
}

function treeCollapseAll(ctx) {
  const state = initTreeState(ctx);
  state.expanded.clear();
  refreshTree(ctx);
}

function treeRemoveSelected(leafId, ctx) {
  const state = initTreeState(ctx);
  state.selected.delete(leafId);
  refreshTree(ctx);
}

function refreshTree(ctx) {
  const container = document.getElementById(`tree-container-${ctx}`);
  if (container) {
    container.innerHTML = renderTreeNodes(ARCHIVE_TREE_DATA, ctx, 0);
  }
  // Fix indeterminate checkboxes
  if (container) {
    container.querySelectorAll('input.tree-checkbox[data-indeterminate="true"]').forEach(cb => {
      cb.indeterminate = true;
    });
  }
  updateTreeSelectedDisplay(ctx);
}

function updateTreeSelectedDisplay(ctx) {
  const state = initTreeState(ctx);
  const bar = document.getElementById(`tree-selected-${ctx}`);
  if (!bar) return;
  if (state.selected.size === 0) {
    bar.innerHTML = '<span class="tree-empty-hint">未选择任何档案范围（表示全部档案）</span>';
    return;
  }
  // Build label path for each selected leaf
  const labels = [];
  function findPath(nodes, targetId, path) {
    for (const n of nodes) {
      const currentPath = [...path, n.label];
      if (n.id === targetId) { labels.push({id:targetId, path:currentPath}); return true; }
      if (n.children && findPath(n.children, targetId, currentPath)) return true;
    }
    return false;
  }
  state.selected.forEach(id => findPath(ARCHIVE_TREE_DATA, id, []));
  // Show compact tags
  let html = `<span style="color:var(--text-secondary);font-size:12px;margin-right:4px;">已选 ${labels.length} 项:</span>`;
  labels.forEach(item => {
    const shortLabel = item.path.length >= 3
      ? `${item.path[item.path.length-2]} / ${item.path[item.path.length-1]}`
      : item.path.join(' / ');
    html += `<span class="tree-tag">${shortLabel}<span class="tag-remove" onclick="treeRemoveSelected('${item.id}','${ctx}')">x</span></span>`;
  });
  bar.innerHTML = html;
}

function getTreeSelectedSummary(ctx) {
  const state = initTreeState(ctx);
  if (state.selected.size === 0) return '全部档案';
  return `已选 ${state.selected.size} 个档案范围`;
}

function computeSearchData() {
  const catCounts = {};
  const yearCounts = {};
  MOCK.archives.forEach(a => {
    catCounts[a.category] = (catCounts[a.category] || 0) + 1;
    yearCounts[a.year] = (yearCounts[a.year] || 0) + 1;
  });
  const sortedYears = Object.keys(yearCounts).sort((a,b) => b - a);
  const scopeLabel = searchScope ? searchScope.label : '全部档案';
  return { catCounts, yearCounts, sortedYears, scopeLabel };
}

// ========== 检索辅助函数 ==========
function reRenderSearch() {
  const content = document.getElementById('contentArea');
  if (content) {
    content.innerHTML = PAGES[currentPage].render();
    document.getElementById('currentPageName').textContent = PAGES[currentPage].name;
  }
}

function changeSearchDimension(dim) {
  searchDimension = dim;
  reRenderSearch();
}

function renderScopeTreeNodes(nodes, depth) {
  let html = '';
  for (const node of nodes) {
    const hasChildren = node.children && node.children.length > 0;
    const isSelected = searchScope && searchScope.id === node.id;
    html += `<div class="tree-node">`;
    html += `<div class="tree-node-row" style="cursor:pointer;" onclick="selectSearchScope('${node.id}','${node.label.replace(/'/g,"\\'")}')">`;
    html += `<span class="tree-toggle ${hasChildren?'':'leaf'}" onclick="event.stopPropagation();scopeTreeToggle('${node.id}')">${hasChildren?'▶':''}</span>`;
    html += `<span class="tree-label ${hasChildren?'folder':''}" style="${isSelected?'color:var(--primary);font-weight:600;':''}">${isSelected?'✓ ':''}${node.label}</span>`;
    html += `</div>`;
    if (hasChildren) {
      html += `<div class="tree-children" id="scope-tree-${node.id}">`;
      html += renderScopeTreeNodes(node.children, depth+1);
      html += `</div>`;
    }
    html += `</div>`;
  }
  return html;
}

function scopeTreeToggle(nodeId) {
  const el = document.getElementById('scope-tree-' + nodeId);
  if (el) {
    el.classList.toggle('show');
    const toggle = el.previousSibling.querySelector('.tree-toggle');
    if (toggle) toggle.textContent = el.classList.contains('show') ? '▼' : '▶';
  }
}

function toggleSearchScope(e) {
  if (e) e.stopPropagation();
  const popover = document.getElementById('scopePopover');
  if (popover) popover.classList.toggle('show');
}

function closeSearchScope() {
  const popover = document.getElementById('scopePopover');
  if (popover) popover.classList.remove('show');
}

function selectSearchScope(id, label) {
  searchScope = { id, label };
  const labelEl = document.getElementById('scopeLabelText');
  if (labelEl) labelEl.textContent = label;
  closeSearchScope();
  // Re-render search
  reRenderSearch();
}

function clearSearchScope() {
  searchScope = null;
  const labelEl = document.getElementById('scopeLabelText');
  if (labelEl) labelEl.textContent = '全部档案';
  closeSearchScope();
  reRenderSearch();
}

function changeSearchLevel(level) {
  searchLevel = level;
  reRenderSearch();
}

function renderResultTreeFilter(nodes, depth) {
  let html = '';
  for (const node of nodes) {
    const hasChildren = node.children && node.children.length > 0;
    // Count results in this node
    const count = countResultsInNode(node);
    if (count === 0 && depth > 0) continue; // Skip empty nodes
    const isActive = searchTreeFilter && searchTreeFilter.id === node.id;
    html += `<div class="tree-node">`;
    html += `<div class="filter-tree-node ${isActive?'active':''}" onclick="filterByTreeNode('${node.id}','${node.label.replace(/'/g,"\\'")}')" style="padding-left:${depth*12+4}px;">`;
    if (hasChildren) {
      html += `<span style="cursor:pointer;font-size:10px;margin-right:2px;" onclick="event.stopPropagation();toggleFilterTreeNode('${node.id}')">▶</span>`;
    } else {
      html += `<span style="width:10px;margin-right:2px;"></span>`;
    }
    html += `<span style="flex:1;">${node.label}</span>`;
    html += `<span class="filter-tree-count">${count}</span>`;
    html += `</div>`;
    if (hasChildren) {
      html += `<div class="filter-tree-children" id="filter-tree-${node.id}" style="display:none;">`;
      html += renderResultTreeFilter(node.children, depth+1);
      html += `</div>`;
    }
    html += `</div>`;
  }
  return html;
}

function countResultsInNode(node) {
  // For prototype: count archives matching this node's category
  const catMap = {
    'cat-admin':'行政档案', 'cat-teach':'教学档案', 'cat-research':'科研档案',
    'cat-finance':'财务档案', 'cat-personnel':'人事档案', 'cat-construction':'基建档案', 'cat-av':'声像档案'
  };
  if (catMap[node.id]) {
    return MOCK.archives.filter(a => a.category === catMap[node.id]).length;
  }
  if (!node.children) return 0;
  return node.children.reduce((sum, child) => sum + countResultsInNode(child), 0);
}

function toggleFilterTreeNode(nodeId) {
  const el = document.getElementById('filter-tree-' + nodeId);
  if (el) {
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }
}

function filterByTreeNode(id, label) {
  if (searchTreeFilter && searchTreeFilter.id === id) {
    searchTreeFilter = null; // Toggle off
  } else {
    searchTreeFilter = { id, label };
  }
  reRenderSearch();
}

function resetTreeFilter() {
  searchTreeFilter = null;
  reRenderSearch();
}

function filterByYear(year) {
  if (searchYearFilter === year) {
    searchYearFilter = null;
  } else {
    searchYearFilter = year;

  reRenderSearch();
}

function resetYearFilter() {

let reviewViewMode = 'item'; // 'item' or 'volume'

function renderReviewHistory() {
  // Group items by department
  const deptGroups = {};
  MOCK.reviewItems.forEach(item => {
    if (!deptGroups[item.dept]) deptGroups[item.dept] = [];
    deptGroups[item.dept].push(item);
  });

  // Group items by volume
  const volumeGroups = {};
  MOCK.reviewItems.forEach(item => {
    if (!volumeGroups[item.volumeId]) {
      volumeGroups[item.volumeId] = { id: item.volumeId, title: item.volumeTitle, dept: item.dept, year: item.year, items: [] };
    }
    volumeGroups[item.volumeId].items.push(item);
  });
  // Compute volume-level suggestion: if any item suggests 不开放, the whole volume is 不开放
  Object.values(volumeGroups).forEach(vol => {
    const hasNotOpen = vol.items.some(i => i.aiSuggestion.includes('不开放'));
    const hasPartial = vol.items.some(i => i.aiSuggestion.includes('部分'));
    vol.overallSuggestion = hasNotOpen ? '建议不开放' : (hasPartial ? '建议部分开放（脱敏后）' : '建议开放');
    vol.maxRisk = vol.items.reduce((max, i) => {
      const order = { high: 3, medium: 2, low: 1 };
      return order[i.risk] > order[max.risk] ? i : max;
    }, { risk: 'low', riskScore: 0 });
  });

  // Group volumes by department
  const volDeptGroups = {};
  Object.values(volumeGroups).forEach(vol => {
    if (!volDeptGroups[vol.dept]) volDeptGroups[vol.dept] = [];
    volDeptGroups[vol.dept].push(vol);
  });

  const deptList = Object.keys(deptGroups).sort();

  if (idx >= 0) MOCK.onlineUsers.splice(idx, 1);
  // Update user online status
  const user = MOCK.users.find(u => u.account === account);
  if (user) user.online = false;

function renderPermTree(nodes, depth, roleIdx) {
  let html = '';
  for (const node of nodes) {
    const hasChildren = node.children && node.children.length > 0;
    const isTopLevel = depth === 0; // 门类级
    const isYearLevel = depth === 1; // 年度级
    const isDeptLevel = depth === 2; // 部门级 (leaf for this tree, represents 案卷级)
    // For this prototype: depth 0-1 = 案卷级, depth 2 (leaf) = 卷内级/文件级
    const isVolumeLevel = depth <= 1;
    const isFileLevel = depth === 2 || !hasChildren;

    html += `<div style="margin-left:${depth * 16}px;">`;
    html += `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;${isTopLevel?'border-bottom:1px solid var(--border-light);':''}">`;
    if (hasChildren) {
      html += `<span style="cursor:pointer;font-size:10px;width:12px;" onclick="this.textContent=this.textContent==='▶'?'▼':'▶';this.parentElement.nextElementSibling.style.display=this.textContent==='▶'?'none':'block';">▼</span>`;
    } else {
      html += `<span style="width:12px;"></span>`;
    }
    html += `<span style="font-size:13px;font-weight:${isTopLevel?'600':'400'};flex:1;">${node.label}</span>`;

    if (isVolumeLevel && hasChildren) {
      // 案卷级权限: 条目浏览
      html += `<label style="font-size:11px;display:flex;align-items:center;gap:3px;white-space:nowrap;"><input type="checkbox" ${roleIdx===0?'checked':''} style="margin:0;"> 条目浏览</label>`;
    }
    if (isFileLevel) {
      // 卷内级/文件级权限
      const filePerms = ['文件浏览','文件下载','条目浏览','文件打印'];
      const checkedPerms = roleIdx === 0 ? filePerms : (roleIdx === 2 ? ['文件浏览','文件下载','条目浏览','文件打印'] : (roleIdx === 3 ? ['文件浏览','文件下载','条目浏览','文件打印'] : []));
      filePerms.forEach(p => {
        html += `<label style="font-size:11px;display:flex;align-items:center;gap:3px;white-space:nowrap;"><input type="checkbox" ${checkedPerms.includes(p)?'checked':''} style="margin:0;"> ${p}</label>`;
      });
    }
    html += `</div>`;
    if (hasChildren) {
      html += `<div>${renderPermTree(node.children, depth+1, roleIdx)}</div>`;
    }
    html += `</div>`;
  }
  return html;
}

/**
 * 导出AI预审结果表格
 * @param {string} taskId - 任务编号（可选，不传则导出全部）
 */
function exportReviewTable(taskId) {
  const items = MOCK.reviewItems.map(item => ({
    '档案编号': item.id,
    '题名': item.title,
    '年度': item.year,
    '归口单位': item.dept,
    '风险评分': item.riskScore,
    '风险等级': item.risk === 'high' ? '高风险' : item.risk === 'medium' ? '中风险' : '低风险',
    '敏感信息': item.sensitive.join('、') || '无',
    'AI开放建议': item.aiSuggestion,
    '预审时间': '2026-07-02 14:30',
    '预审耗时(秒)': (0.6 + Math.random() * 0.5).toFixed(2),
    'AI模型': 'DeepSeek-32B',
    '置信度': '92%',
  }));

  // 模拟生成CSV
  const headers = Object.keys(items[0]);
  const csv = [
    '\ufeff' + headers.join(','),
    ...items.map(row => headers.map(h => `"${row[h]}"`).join(','))
  ].join('\n');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fileName = taskId
    ? `AI预审结果_${taskId}_${new Date().toISOString().slice(0,10)}.csv`
    : `AI预审结果_全部任务_${new Date().toISOString().slice(0,10)}.csv`;
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);

  showToast(`✅ AI预审结果表格已导出：${fileName}\\n共 ${items.length} 条记录`, 'success');
}

        <div class="detail-row"><div class="detail-label">开放状态</div><div class="detail-value">${archive.status==='已开放'?'<span class="tag tag-green">已开放</span>':archive.status==='预审中'?'<span class="tag tag-orange">预审中</span>':'<span class="tag tag-gray">待预审</span>'}</div></div>
        <div class="detail-row"><div class="detail-label">检索相关度</div><div class="detail-value"><strong style="color:var(--primary);">${archive.score}%</strong></div></div>
      </div>
      <div class="detail-section">
        <h4>📝 内容摘要</h4>
        <p style="font-size:13px;line-height:1.8;color:var(--text);background:#f9f9f9;padding:16px;border-radius:var(--radius);">${archive.snippet.replace(/<mark>/g,'<span style="background:#fff3cd;color:#856404;padding:0 2px;border-radius:2px;">').replace(/<\/mark>/g,'</span>')}</p>
      </div>
      <div class="detail-section">
        <h4>📄 档案原文</h4>
        <div style="background:#fafafa;border:1px solid var(--border);border-radius:4px;padding:24px;font-family:'FangSong',serif;font-size:14px;line-height:2;">
          <p style="text-align:center;font-weight:bold;margin-bottom:16px;">${archive.title}</p>
          <p style="text-indent:2em;">${archive.snippet.replace(/<mark>/g,'').replace(/<\/mark>/g,'')}本档案共3页，以下为第1页内容...</p>
          <p style="text-indent:2em;margin-top:12px;">详细内容包括：文件正文、附件材料、审批签字页等。该档案已于${archive.year}年归档保存，保管期限为永久。</p>
        </div>
      </div>
      <div class="detail-section">
        <h4>🔗 关联档案（AI推荐）</h4>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${MOCK.archives.filter(a => a.id !== id).slice(0,3).map(a => `
            <div style="padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;" onclick="closeModal();setTimeout(()=>showArchiveDetail('${a.id}'),200);">
              <div style="font-size:13px;font-weight:500;">${a.title}</div>
              <div style="font-size:12px;color:var(--text-secondary);">${a.id} | ${a.year}年 | ${a.dept}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn">📥 下载档案</button>
      <button class="btn btn-primary">🖨️ 打印证明</button>
    </div>
  `);
}
function showCreateOCR() {
  openModal(`
    <div class="modal-header">
      <h3>新建OCR任务</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;">任务名称</label>
        <input type="text" style="width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);" placeholder="如：2026年度行政档案OCR处理">
      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;">档案范围（目录树选择）</label>
        ${renderArchiveTree('ocr')}
      </div>
      <div style="padding:12px;background:#f0f7ff;border-radius:var(--radius);font-size:12px;color:var(--text-secondary);">
        提示：OCR处理采用本地昇腾NPU推理，数据不上云。处理完成后识别结果将自动同步至Elasticsearch全文检索索引。
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="closeModal();alert('OCR任务已创建，系统将自动开始处理\\n档案范围：' + getTreeSelectedSummary('ocr'))">创建任务</button>
    </div>
  `);
}

function showCreateReviewTask() {

      <h3>新建审核任务</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>

      </div>
      <div style="margin-bottom:16px;">
        <label style="display:block;font-size:13px;color:var(--text-secondary);margin-bottom:6px;font-weight:500;">档案范围（目录树选择）</label>
        ${renderArchiveTree('review')}
      </div>
      <div style="margin-bottom:16px;">

      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="closeModal();alert('审核任务已创建，AI预审将自动开始\\n档案范围：' + getTreeSelectedSummary('review'))">创建任务</button>
    </div>

function showOCRDetail(id) {
  const task = MOCK.ocrTasks.find(t => t.id === id);
  if (!task) return;
  openModal(`
    <div class="modal-header">
      <h3>OCR任务详情 - ${task.id}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="detail-section">
        <h4>📋 任务信息</h4>
        <div class="detail-row"><div class="detail-label">任务名称</div><div class="detail-value">${task.name}</div></div>
        <div class="detail-row"><div class="detail-label">任务编号</div><div class="detail-value">${task.id}</div></div>
        <div class="detail-row"><div class="detail-label">开始时间</div><div class="detail-value">${task.startTime}</div></div>
        <div class="detail-row"><div class="detail-label">总文件数</div><div class="detail-value">${task.total}</div></div>
        <div class="detail-row"><div class="detail-label">已处理</div><div class="detail-value">${task.done} / ${task.total}</div></div>
        <div class="detail-row"><div class="detail-label">失败数</div><div class="detail-value">${task.failed}</div></div>
        <div class="detail-row"><div class="detail-label">准确率</div><div class="detail-value">${task.accuracy?task.accuracy+'%':'-'}</div></div>
      </div>
      <div class="detail-section">
        <h4>📊 处理进度</h4>
        <div class="progress" style="height:20px;margin-bottom:8px;">
          <div class="progress-bar" style="width:${task.total?Math.round(task.done/task.total*100):0}%;background:${task.status==='done'?'#52c41a':'#1890ff'};line-height:20px;color:#fff;text-align:center;font-size:12px;">${task.total?Math.round(task.done/task.total*100):0}%</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);">
          <span>已完成 ${task.done}</span>
          <span>失败 ${task.failed}</span>
          <span>剩余 ${task.total - task.done}</span>
        </div>
      </div>
      <div class="detail-section">
        <h4>🔍 识别质量分析</h4>
        <table class="data-table">
          <thead><tr><th>质量指标</th><th>数值</th><th>评价</th></tr></thead>
          <tbody>
            <tr><td>印刷体识别准确率</td><td>97.2%</td><td><span class="tag tag-green">优秀</span></td></tr>
            <tr><td>手写体识别准确率</td><td>86.5%</td><td><span class="tag tag-blue">良好</span></td></tr>
            <tr><td>复杂版式解析率</td><td>91.8%</td><td><span class="tag tag-green">优秀</span></td></tr>
            <tr><td>表格识别准确率</td><td>93.4%</td><td><span class="tag tag-green">优秀</span></td></tr>
            <tr><td>平均处理速度</td><td>0.8秒/页</td><td><span class="tag tag-green">高效</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">关闭</button>
      ${task.status==='done'?'<button class="btn btn-primary">📥 下载结果</button>':''}
    </div>
  `);
}

// ========== Chart.js 图表渲染 ==========
function loadChartJS(callback) {
  if (window.Chart) { callback(); return; }
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js';
  script.onload = callback;
  document.head.appendChild(script);
}
