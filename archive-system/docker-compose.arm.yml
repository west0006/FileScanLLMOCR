# L3 昇腾一体机部署 —— ARM (aarch64) Docker Compose
#
# 与 docker-compose.yml 的差异：
#   - 所有服务构建参数 TARGETARCH=arm64（避免默认 amd64 构建 ARM 失败）
#   - backend/celery/ocr-worker 显式 DB_MODE=mysql
#   - OCR/LLM 真实推理在昇腾 NPU 上需 CANN（非 CUDA），本编排仅保证容器骨架与
#     arm64 构建正确；NPU 推理镜像需接入 CANN 运行时后另行定制（不在本文件范围）
#
# 使用: docker compose -f docker-compose.arm.yml up -d

version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    container_name: archive-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LLM_MODE=${LLM_MODE:-mock}
      - OCR_MODE=${OCR_MODE:-mock}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=archive
      - DB_PASSWORD=${DB_PASSWORD:-archive123}
      - DB_NAME=archive_db
      - DB_MODE=mysql
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - JWT_EXPIRE_MINUTES=120
    volumes:
      - ./backend:/app
      - archive_uploads:/app/uploads
      - archive_sync:/app/sync_data
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    container_name: archive-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LLM_MODE=${LLM_MODE:-mock}
      - OCR_MODE=${OCR_MODE:-mock}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=archive
      - DB_PASSWORD=${DB_PASSWORD:-archive123}
      - DB_NAME=archive_db
      - DB_MODE=mysql
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - archive_uploads:/app/uploads
      - archive_sync:/app/sync_data
    depends_on:
      - mysql
      - elasticsearch
      - redis
    restart: unless-stopped

  # 昇腾 NPU 上 OCR 真实推理需 CANN 运行时；本占位默认 CPU/mock 模式
  ocr-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGETARCH: arm64
    container_name: archive-ocr
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --queues=ocr
    environment:
      - APP_ENV=${APP_ENV:-development}
      - OCR_MODE=${OCR_MODE:-mock}
      - LLM_MODE=mock
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=archive
      - DB_PASSWORD=${DB_PASSWORD:-archive123}
      - DB_NAME=archive_db
      - DB_MODE=mysql
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
      - archive_uploads:/app/uploads
      - archive_sync:/app/sync_data
      - ocr_models:/root/.paddleocr
    depends_on:
      - mysql
      - elasticsearch
      - redis
    restart: unless-stopped
    profiles: ["ocr"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: archive-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    platform: linux/arm64
    container_name: archive-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=archive_db
      - MYSQL_USER=archive
      - MYSQL_PASSWORD=${DB_PASSWORD:-archive123}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01_init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "archive", "-p${DB_PASSWORD:-archive123}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 注意：ARM 上 IK 插件需用对应 arm64 构建（stock ES 镜像不含 IK，见 init_es.sh 前置检查）
  elasticsearch:
    image: elasticsearch:8.12.0
    platform: linux/arm64
    container_name: archive-es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: archive-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  es_data:
  redis_data:
  archive_uploads:
  archive_sync:
  ocr_models:
